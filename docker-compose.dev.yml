version: '3.9'

# Development: runs only postgres + redis
# Use this with: docker compose -f docker-compose.dev.yml up -d
# Then run the apps locally: npm run dev

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: maos_db
      POSTGRES_USER: maos
      POSTGRES_PASSWORD: maos_password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U maos -d maos_db']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
