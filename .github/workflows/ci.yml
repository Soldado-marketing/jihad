name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  api:
    name: API - typecheck, build, tests
    runs-on: ubuntu-latest

    services:
      postgres:
        # Same image as docker.io/library/postgres:16-alpine (identical digest
        # sha256:721873c3..., checked 2026-10-14). Docker Hub (MAOS-T146) and
        # then AWS ECR Public ("toomanyrequests: Data limit exceeded", three
        # failed runs on 2026-10-13) both throttled anonymous pulls before any
        # test ran; Google's public Docker Hub mirror serves the same digest.
        image: mirror.gcr.io/library/postgres:16-alpine
        env:
          POSTGRES_USER: maos
          POSTGRES_PASSWORD: maos_password
          POSTGRES_DB: maos_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maos -d maos_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://maos:maos_password@localhost:5432/maos_db?schema=public
      # CI-only values, long enough to satisfy the S-01 startup validator.
      JWT_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      JWT_REFRESH_SECRET: ci-only-refresh-0123456789abcdef0123456789abcdef

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      # No --legacy-peer-deps: @nestjs/jwt and @nestjs/passport were moved to
      # their NestJS 11 lines, so peer resolution is clean. If this step ever
      # fails with ERESOLVE again, fix the offending package rather than
      # reinstating the flag.
      - name: Install dependencies
        working-directory: apps/api
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        working-directory: apps/api
        run: npx prisma generate

      # migrate deploy only. `migrate dev` and `db push` are forbidden in this
      # project: they can rewrite or drop migration history.
      - name: Apply migrations
        working-directory: apps/api
        run: npx prisma migrate deploy

      # Production sources only. The repository still contains legacy *.spec.ts
      # files written for a test runner that is not installed;
      # tsconfig.build.json excludes them, so this gate is meaningful and green.
      - name: Typecheck (production sources)
        working-directory: apps/api
        run: npx tsc --noEmit -p tsconfig.build.json

      - name: Build
        working-directory: apps/api
        run: npm run build

      # Blocking gate: the suites that are fully green today (361 tests).
      - name: Unit and contract tests
        working-directory: apps/api
        run: |
          node --test \
            test/security-mvp.test.mjs \
            test/runtime-hardening.test.mjs \
            test/no-store-cache.test.mjs \
            test/file-formats-matrix.test.mjs \
            test/storage-reconcile.test.mjs \
            test/customer-history.test.mjs \
            test/sprint-1a-baseline.test.mjs \
            test/sprint-13-auth-login-flow.test.mjs \
            test/phase-3-file-storage.test.mjs \
            test/phase-4-invoicing.test.mjs \
            test/security-gate-file-deletion.test.mjs \
            test/mail-config.test.mjs \
            test/invoice-send-privacy.test.mjs \
            test/backup-restore-scripts.test.mjs \
            test/nightly-backup-script.test.mjs \
            test/restore-rehearsal-script.test.mjs \
            test/backup-alerting.test.mjs \
            test/email-delivery-tracking.test.mjs \
            test/backup-schedule.test.mjs \
            test/labour-cost.test.mjs \
            test/offsite-backup.test.mjs \
            test/trust-proxy.test.mjs \
            test/migrate-deploy-one-script.test.mjs \
            test/csv-transfer.test.mjs \
            test/rate-resolution.test.mjs \
            test/labour-profitability.test.mjs \
            test/client-file-privacy.test.mjs \
            test/byte-range.test.mjs

      # HTTP integration tests: boots the real app against the PostgreSQL
      # service above and drives it over HTTP. Green (398/398), so it blocks.
      # security-gate-authz proves the guards are actually wired: a controller
      # can carry every decorator and still answer 200 if its module never
      # imported PermissionsModule, which source assertions cannot catch.
      # security-gate-client-isolation proves one client cannot reach another
      # inside the same tenant, and - just as important - that each client can
      # still reach its own, which a broken portal would otherwise pass.
      # invoice-default-recipients proves a default send reaches only the
      # invoice's own, active client.
      # visibility-scope proves approval stores only an enforced scope.
      # finance-payment-rules proves payments respect invoice status, currency
      # and client scope.
      # security-gate-foreign-ids proves IDs sent in a body or path (project,
      # assignee, parent task) must belong to the caller's tenant.
      # login-history proves login attempts are recorded (IP hashed only) and
      # that each user can read their own history and nobody else's.
      # security-gate-session-revocation proves a suspended or non-active user
      # loses access immediately: existing access and refresh tokens stop working.
      # throttle-per-client proves rate limits apply per client behind the proxy.
      # security-gate-sessions proves session list/revoke act on own sessions only.
      # security-gate-foreign-ids-content extends that to files, approvals, chat,
      # voice notes and internal notes; -crm-finance to leads, opportunities,
      # meetings, follow-ups, invoices and payments.
      # security-gate-contractor-scope proves a CONTRACTOR sees only assigned work.
      # security-gate-member-management proves role changes drop the old role's
      # permissions, removal ends one company only, and Owners are never changed.
      # security-gate-role-transitions (E03) proves what each role change and grant
      # revocation takes away and keeps, per company, on old and refreshed tokens,
      # that refused changes write nothing, and that the last Owner is protected.
      # security-gate-client-deliveries proves a client reviews only its own deliveries,
      # sees the company name only, and change requests reach the assigned employee.
      # security-gate-client-complaints proves a problem report reaches management only,
      # internal notes never reach the client, and a project invoice inherits its customer.
      # client-onboarding-scope proves an approved client gets its client scope.
      # crm-update-validation proves CRM updates and reports validate their bodies.
      # notification-writers proves events reach only their audience (T47).
      # activity-timeline proves the audit timeline is permission- and scope-filtered (T65).
      # task-lists proves custom board lists: per-project isolation, explicit idempotent setup, scoped card moves.
      # my-work proves the My Work view holds only the caller's permitted items (T67).
      # audit-log proves the audit log is OWNER-only and pages correctly (T132).
      # calendar proves the calendar shows each type only to permitted roles (T103).
      # approval-decisions proves only open approvals can be decided, once (T108).
      # revenue-posting-unique proves invoice revenue is posted once (T40).
      # payment-idempotency proves a repeated payment submit records once (D16).
      # customer-overview proves Customer 360 sections follow permissions, money is OWNER only (T54).
      # data-transfer proves CSV export/import follow permissions and tenants, all-or-nothing (T118).
      # time-entry-schema proves the TimeEntry/Rate database invariants (T71, ADR-018).
      # time-entries proves the TimeEntry API: own entries, review, contractor scope, no rate leak (T72).
      # rates proves OWNER-only rates, member -> role -> tenant freezing, unchanged history, re-rating (T73).
      # finance-labour proves stored labour in profitability and summary, unrated minutes flagged (T74).
      # customer-profitability proves per-customer revenue, cost and labour that reconcile with the summary (T75).
      # video-large-files (C05) proves 25/100 MiB MP4 uploads at their limits, byte-identical
      # staff downloads, the streamed client copy, HTTP ranges (206/416) on both content
      # routes with unchanged authorisation, and bounded memory for a 100 MiB client download.
      # integration-api runs alone and first: it exercises the real one-time
      # /auth/bootstrap, which answers 403 once any OWNER exists. The two
      # security-gate suites seed OWNERs directly, so running them in parallel
      # with it was a race that cascaded into 17 failures. They seed their own
      # tenants and do not need an empty database, so they share the second run.
      # The step shell is bash -e: a failure in the first run fails the step.
      # The tenant/client/role isolation suites (security-gate-*, company-access-
      # isolation, client scope) run in the separate `isolation-gate` job below
      # (B09), so a leak fails a check with that name.
      - name: Integration tests
        working-directory: apps/api
        env:
          MAOS_INTEGRATION: '1'
        run: |
          node --test test/integration-api.test.mjs
          node --test \
            test/control-center.test.mjs \
            test/finance-payment-rules.test.mjs \
            test/crm-update-validation.test.mjs \
            test/notification-writers.test.mjs \
            test/project-enrichment.test.mjs \
            test/customers.test.mjs \
            test/customer-overview.test.mjs \
            test/customer-history-api.test.mjs \
            test/data-transfer.test.mjs \
            test/time-entry-schema.test.mjs \
            test/time-entries.test.mjs \
            test/rates.test.mjs \
            test/finance-labour.test.mjs \
            test/customer-profitability.test.mjs \
            test/global-search.test.mjs \
            test/email-deliveries-endpoint.test.mjs \
            test/payment-idempotency.test.mjs \
            test/revenue-posting-unique.test.mjs \
            test/approval-decisions.test.mjs \
            test/calendar.test.mjs \
            test/audit-log.test.mjs \
            test/my-work.test.mjs \
            test/activity-timeline.test.mjs \
            test/task-lists.test.mjs \
            test/login-history.test.mjs \
            test/throttle-per-client.test.mjs \
            test/invites.test.mjs \
            test/scheduler.test.mjs \
            test/deadline-reminders.test.mjs \
            test/client-review-reminders.test.mjs \
            test/ops-alerts.test.mjs \
            test/storage-reconcile-job.test.mjs \
            test/storage-delete-inventory.test.mjs \
            test/video-large-files.test.mjs

      # Blocking (MAOS-T39): every API suite. The stale sprint baselines were
      # rewritten to the current code; features specified but never built are
      # `todo` entries (backlog F-4), reported without failing. Integration
      # suites skip here (no MAOS_INTEGRATION) - they ran above.
      - name: Full suite
        working-directory: apps/api
        run: npm test

      # Operator scripts outside apps/ (a change there redeploys nothing):
      # private Railway tunnel for the read-only check and the migration
      # runner. Blocking, like the backup and runner suites in npm test.
      - name: Operator script tests
        run: node --test scripts/test/*.test.mjs

  # B09: the tenant-isolation regression suite as a named, blocking gate.
  # Each suite boots the real app over HTTP against the PostgreSQL service and
  # proves one group of invariants listed in docs/security/TENANT_ISOLATION_INVARIANTS.md
  # (the file names map to its sections). A leak between companies, clients or
  # roles fails this check by name. The suites seed their own tenants and do
  # not need an empty database, so they share one run.
  isolation-gate:
    name: Isolation gate - tenant, client and role boundaries
    runs-on: ubuntu-latest

    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16-alpine
        env:
          POSTGRES_USER: maos
          POSTGRES_PASSWORD: maos_password
          POSTGRES_DB: maos_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maos -d maos_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://maos:maos_password@localhost:5432/maos_db?schema=public
      JWT_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      JWT_REFRESH_SECRET: ci-only-refresh-0123456789abcdef0123456789abcdef

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        working-directory: apps/api
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        working-directory: apps/api
        run: npx prisma generate

      - name: Apply migrations
        working-directory: apps/api
        run: npx prisma migrate deploy

      - name: Build
        working-directory: apps/api
        run: npm run build

      # Unit-level invariants that need no database: a deleted file leaves no
      # object behind, and a client copy carries no identifying metadata.
      - name: Isolation unit suites
        working-directory: apps/api
        run: node --test test/security-gate-file-deletion.test.mjs test/client-file-privacy.test.mjs

      - name: Isolation integration suites
        working-directory: apps/api
        env:
          MAOS_INTEGRATION: '1'
        run: |
          node --test \
            test/security-gate-authz.test.mjs \
            test/company-access-isolation.test.mjs \
            test/security-gate-client-isolation.test.mjs \
            test/invoice-default-recipients.test.mjs \
            test/visibility-scope.test.mjs \
            test/security-gate-foreign-ids.test.mjs \
            test/security-gate-foreign-ids-content.test.mjs \
            test/security-gate-foreign-ids-crm-finance.test.mjs \
            test/security-gate-contractor-scope.test.mjs \
            test/security-gate-explicit-grants.test.mjs \
            test/security-gate-member-management.test.mjs \
            test/security-gate-role-transitions.test.mjs \
            test/security-gate-client-deliveries.test.mjs \
            test/security-gate-client-portal-v2.test.mjs \
            test/security-gate-client-complaints.test.mjs \
            test/security-gate-client-work-requests.test.mjs \
            test/client-onboarding-scope.test.mjs \
            test/client-scope-inheritance.test.mjs \
            test/security-gate-session-revocation.test.mjs \
            test/security-gate-sessions.test.mjs

  web:
    name: Web - typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck

      - name: Build
        working-directory: apps/web
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      # Blocking: a partial invoice send must read as a warning with counts,
      # never as a full success.
      # Blocking: every route carries the security headers (MAOS-T33).
      # Blocking: no visibility choice the backend does not enforce (MAOS-T36).
      - name: Web contract tests
        working-directory: apps/web
        run: node --test test/invoice-send-result.test.mjs test/security-headers.test.mjs test/access-scope.test.mjs

      # Blocking (MAOS-T39): every web suite.
      - name: Web tests
        working-directory: apps/web
        run: npm test

  # A09: browser smoke of the isolated stack. The real API (built dist) and the
  # real production web build run on this runner against the PostgreSQL
  # service and an in-memory S3 stub (apps/api/test/support/s3-stub.mjs);
  # Playwright drives Chromium, desktop and mobile, through the OWNER, MANAGER,
  # EMPLOYEE and CLIENT paths, the project board, tasks, files with a delivery,
  # invoices, appointments, and the boundaries between roles, clients and
  # companies (apps/web/e2e/*.spec.ts). Fictional data only, generated per run
  # by e2e/global-setup.ts; no mail provider is configured, so the invitation
  # link comes back from the API as it does on a fresh install.
  e2e-smoke:
    name: Browser smoke - roles, boards, files, invoices and boundaries on the isolated stack
    runs-on: ubuntu-latest

    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16-alpine
        env:
          POSTGRES_USER: maos
          POSTGRES_PASSWORD: maos_password
          POSTGRES_DB: maos_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maos -d maos_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://maos:maos_password@localhost:5432/maos_db?schema=public
      JWT_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      JWT_REFRESH_SECRET: ci-only-refresh-0123456789abcdef0123456789abcdef
      CORS_ORIGINS: http://127.0.0.1:3000
      WEB_URL: http://127.0.0.1:3000
      # As behind Railway's proxy: the seed signs each fictional person in from
      # its own documentation-range address (X-Forwarded-For), so the per-address
      # login throttle stays in force and still lets the seed through.
      TRUST_PROXY_HOPS: '1'
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3001
      NEXT_TELEMETRY_DISABLED: '1'
      # Object storage for uploads: the in-memory stub below. CI-only values.
      S3_BUCKET: e2e
      S3_REGION: eu-central-1
      S3_ACCESS_KEY_ID: e2e-ci-only
      S3_SECRET_ACCESS_KEY: e2e-ci-only-not-a-secret
      S3_ENDPOINT: http://127.0.0.1:9100
      S3_FORCE_PATH_STYLE: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json

      - name: Install and build the API
        working-directory: apps/api
        run: |
          npm ci --no-audit --no-fund
          npx prisma generate
          npx prisma migrate deploy
          npm run build

      # Background processes keep running across the following steps of this job.
      - name: Start the object-storage stub
        working-directory: apps/web
        run: |
          nohup node ../api/test/support/s3-stub.mjs 9100 > "$RUNNER_TEMP/s3.log" 2>&1 &
          for i in $(seq 1 20); do
            curl -s -o /dev/null "http://127.0.0.1:9100/e2e?list-type=2" && exit 0
            sleep 1
          done
          echo "storage stub not ready"; cat "$RUNNER_TEMP/s3.log"; exit 1

      - name: Start the API
        working-directory: apps/api
        run: |
          PORT=3001 NODE_ENV=production nohup node dist/main.js > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:3001/api/health/ready && exit 0
            sleep 1
          done
          echo "API not ready"; cat "$RUNNER_TEMP/api.log"; exit 1

      - name: Install, build and start the web app
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npm run build
          PORT=3000 HOSTNAME=127.0.0.1 NODE_ENV=production nohup node scripts/start-standalone.mjs > "$RUNNER_TEMP/web.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:3000/auth/login && exit 0
            sleep 1
          done
          echo "web not ready"; cat "$RUNNER_TEMP/web.log"; exit 1

      - name: Install Chromium for Playwright
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      # global-setup seeds the first company through the API and the second one
      # directly (apps/api/test/e2e-seed-company.mjs), then both viewport
      # projects (desktop, mobile) run every spec.
      - name: Browser smoke
        working-directory: apps/web
        env:
          E2E_WEB_URL: http://127.0.0.1:3000
          E2E_API_URL: http://127.0.0.1:3001/api
          E2E_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: npm run e2e

      - name: Keep the evidence of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-evidence
          if-no-files-found: ignore
          retention-days: 7
          path: |
            apps/web/playwright-report
            apps/web/test-results
            ${{ runner.temp }}/api.log
            ${{ runner.temp }}/web.log
            ${{ runner.temp }}/s3.log

  audit:
    name: Dependency audit (blocking on high in production dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # B08: production dependencies must carry no high or critical advisory.
      # `npm audit fix --force` stays forbidden (silent major upgrades); fixes
      # are reviewed bumps in a PR. Dev-only advisories are reported, not blocking.
      - name: Audit API production dependencies (blocking)
        working-directory: apps/api
        run: npm audit --omit=dev --audit-level=high
      - name: Audit web production dependencies (blocking)
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high
      - name: Audit development dependencies (informational)
        continue-on-error: true
        run: |
          (cd apps/api && npm audit --audit-level=high) || true
          (cd apps/web && npm audit --audit-level=high) || true

  secrets:
    name: Secret scan (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # B08: a committed credential fails the build. The scan reads the git
      # history of the push/PR; no secret is ever printed (gitleaks redacts).
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: "false"
